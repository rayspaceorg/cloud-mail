name: Deploy cloud-mail to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ vars.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      WORKER_NAME: ${{ vars.WORKER_NAME || 'cloud-mail' }}
      DOMAIN: ${{ vars.DOMAIN }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      ZONE_NAME: ${{ vars.ZONE_NAME }}
      ADMIN: ${{ vars.ADMIN }}
      R2_ENABLED: ${{ vars.R2_ENABLED || 'false' }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      CF_EMAIL_ENABLED: ${{ vars.CF_EMAIL_ENABLED || 'false' }}
      AI_MODEL: ${{ vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
      ANALYSIS_CACHE: ${{ vars.ANALYSIS_CACHE || 'false' }}
      PROJECT_LINK: ${{ vars.PROJECT_LINK || 'false' }}
      LINUXDO_SWITCH: ${{ vars.LINUXDO_SWITCH || 'false' }}
      LINUXDO_CLIENT_ID: ${{ vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET }}
      LINUXDO_CALLBACK_URL: ${{ vars.LINUXDO_CALLBACK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is required." >&2
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]] && \
             { [[ -z "${CLOUDFLARE_API_KEY}" ]] || [[ -z "${CLOUDFLARE_EMAIL}" ]]; }; then
            echo "Set CLOUDFLARE_API_TOKEN, or both CLOUDFLARE_API_KEY and CLOUDFLARE_EMAIL." >&2
            exit 1
          fi

          if [[ ! "${JWT_SECRET}" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
            echo "JWT_SECRET must contain at least 32 URL-safe characters." >&2
            exit 1
          fi

      - name: Install worker dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mail-worker

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mail-vue

      - name: Build frontend
        run: pnpm run build
        working-directory: mail-vue

      - name: Ensure Cloudflare resources
        id: resources
        shell: bash
        working-directory: mail-worker
        run: |
          set -euo pipefail

          D1_DATABASE_NAME="${WORKER_NAME}-db"
          KV_NAMESPACE_NAME="${WORKER_NAME}-kv"
          R2_NAME="${R2_BUCKET_NAME:-${WORKER_NAME}-attachments}"

          D1_LIST="$(pnpm exec wrangler d1 list --json)"
          D1_DATABASE_ID="$(jq -r --arg name "$D1_DATABASE_NAME" '.[] | select(.name == $name) | .uuid' <<< "$D1_LIST" | head -n 1)"
          if [[ -z "$D1_DATABASE_ID" ]]; then
            pnpm exec wrangler d1 create "$D1_DATABASE_NAME"
            D1_LIST="$(pnpm exec wrangler d1 list --json)"
            D1_DATABASE_ID="$(jq -r --arg name "$D1_DATABASE_NAME" '.[] | select(.name == $name) | .uuid' <<< "$D1_LIST" | head -n 1)"
          fi

          KV_LIST="$(pnpm exec wrangler kv namespace list)"
          KV_NAMESPACE_ID="$(jq -r --arg name "$KV_NAMESPACE_NAME" '.[] | select(.title == $name) | .id' <<< "$KV_LIST" | head -n 1)"
          if [[ -z "$KV_NAMESPACE_ID" ]]; then
            pnpm exec wrangler kv namespace create "$KV_NAMESPACE_NAME"
            KV_LIST="$(pnpm exec wrangler kv namespace list)"
            KV_NAMESPACE_ID="$(jq -r --arg name "$KV_NAMESPACE_NAME" '.[] | select(.title == $name) | .id' <<< "$KV_LIST" | head -n 1)"
          fi

          if [[ -z "$D1_DATABASE_ID" ]] || [[ -z "$KV_NAMESPACE_ID" ]]; then
            echo "Cloudflare resource creation did not return the expected IDs." >&2
            exit 1
          fi

          if [[ "${R2_ENABLED,,}" == "true" ]]; then
            if ! pnpm exec wrangler r2 bucket info "$R2_NAME" --json >/dev/null 2>&1; then
              pnpm exec wrangler r2 bucket create "$R2_NAME"
            fi
          fi

          {
            echo "d1_database_name=$D1_DATABASE_NAME"
            echo "d1_database_id=$D1_DATABASE_ID"
            echo "kv_namespace_id=$KV_NAMESPACE_ID"
            echo "r2_bucket_name=$R2_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Render Wrangler configuration
        env:
          D1_DATABASE_NAME: ${{ steps.resources.outputs.d1_database_name }}
          D1_DATABASE_ID: ${{ steps.resources.outputs.d1_database_id }}
          KV_NAMESPACE_ID: ${{ steps.resources.outputs.kv_namespace_id }}
          R2_BUCKET_NAME: ${{ steps.resources.outputs.r2_bucket_name }}
        run: node scripts/render-wrangler-config.mjs wrangler.generated.json
        working-directory: mail-worker

      - name: Create Worker secret file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SECRET_FILE="$RUNNER_TEMP/cloud-mail-secrets.json"
          jq -n --arg jwt_secret "$JWT_SECRET" '{jwt_secret: $jwt_secret}' > "$SECRET_FILE"

          if [[ "${LINUXDO_SWITCH,,}" == "true" ]]; then
            if [[ -z "${LINUXDO_CLIENT_SECRET}" ]]; then
              echo "LINUXDO_CLIENT_SECRET is required when LINUXDO_SWITCH is true." >&2
              exit 1
            fi
            jq --arg secret "$LINUXDO_CLIENT_SECRET" \
              '. + {linuxdo_client_secret: $secret}' \
              "$SECRET_FILE" > "$RUNNER_TEMP/cloud-mail-secrets.tmp"
            mv "$RUNNER_TEMP/cloud-mail-secrets.tmp" "$SECRET_FILE"
          fi

      - name: Deploy Worker
        id: deploy
        shell: bash
        working-directory: mail-worker
        run: |
          set -euo pipefail

          DEPLOY_LOG="$RUNNER_TEMP/cloud-mail-deploy.log"
          set +e
          pnpm exec wrangler deploy \
            --config wrangler.generated.json \
            --secrets-file "$RUNNER_TEMP/cloud-mail-secrets.json" 2>&1 | tee "$DEPLOY_LOG"
          DEPLOY_STATUS=${PIPESTATUS[0]}
          set -e

          if [[ $DEPLOY_STATUS -ne 0 ]]; then
            exit "$DEPLOY_STATUS"
          fi

          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          if [[ -n "$WORKER_URL" ]]; then
            echo "::add-mask::$WORKER_URL"
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Initialize database
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail

          PUBLIC_URL="${CUSTOM_DOMAIN:+https://${CUSTOM_DOMAIN}}"
          PUBLIC_URL="${PUBLIC_URL:-${WORKER_URL}}"

          # workers.dev normally becomes available before a newly provisioned
          # custom-domain certificate, so prefer it for the one-time init call.
          BASE_URL="${WORKER_URL:-${PUBLIC_URL}}"

          if [[ -z "$BASE_URL" ]]; then
            echo "Unable to determine the deployed Worker URL." >&2
            exit 1
          fi

          for attempt in {1..12}; do
            RESPONSE="$(curl --silent --show-error --location --max-time 30 \
              --write-out $'\n%{http_code}' \
              "$BASE_URL/api/init/$JWT_SECRET" || true)"
            HTTP_CODE="${RESPONSE##*$'\n'}"
            BODY="${RESPONSE%$'\n'*}"

            if [[ "$HTTP_CODE" == "200" ]] && [[ "$BODY" == "success" ]]; then
              echo "Database initialized successfully at $BASE_URL."
              {
                echo "## Cloud Mail deployment"
                echo
                echo "- URL: $PUBLIC_URL"
                echo "- Worker: $WORKER_NAME"
                echo "- D1: ${{ steps.resources.outputs.d1_database_name }}"
                echo "- KV: ${WORKER_NAME}-kv"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Initialization attempt $attempt/12 returned HTTP $HTTP_CODE."
            sleep 5
          done

          echo "Database initialization failed after 12 attempts." >&2
          exit 1
